<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pixel Fire</title><link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;--y:#ffc107}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none}
#cf,#cf *,#pan,#pan *{touch-action:pan-y}
#cf .hx,#cf .hx *{touch-action:pan-x}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font:700 14px system-ui,sans-serif;color:#fff}
#cv{position:fixed;inset:0;width:100%;height:100%}
.scr{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);pointer-events:none}
.scr>*{pointer-events:auto;position:absolute}
.hide{display:none!important}
button,.b{font:inherit;color:#fff;background:#1a2040cc;border:2px solid #fff3;border-radius:8px;padding:8px 12px}
.y{background:var(--y);color:#111}
.mn{background:#000a;border:0;border-left:4px solid var(--y);border-radius:0;color:var(--y);text-align:left;padding:6px 10px;font-size:13px}
#pan{left:8px;top:8px;bottom:8px;width:min(64%,600px);background:#0b130fee;border:2px solid #2a3a2a;border-radius:12px;padding:10px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.it{background:#1c1a0f;border:2px solid #5a4a10;border-radius:8px;padding:6px;text-align:center;font-size:12px}
.sw{height:44px;border-radius:6px;margin-bottom:4px;display:flex;align-items:center;justify-content:center;font-size:28px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.cb{width:64px;height:64px;border-radius:50%;font-size:26px;padding:0}
#joy{left:24px;bottom:28px;width:130px;height:130px;border-radius:50%;background:#fff2;border:2px solid #fff5}
#kn{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;background:#fffa;transform:translate(-50%,-50%)}
#tt{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:20px;z-index:9}
#rot{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;font-size:20px}
@media(orientation:portrait){#rot{display:flex}}

const bar=document.createElement('div');bar.id='mmt';bar.className='hide';
bar.style.cssText='position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:30;background:#000e;border:2px solid var(--y);border-top:0;border-radius:0 0 14px 14px;padding:6px 18px 8px;text-align:center;font-size:13px;min-width:190px';
bar.innerHTML='<div id="mmx">🔎 Buscando partida...</div><b id="mmn" style="font-size:22px;color:var(--y)">0:00</b><br><button id="mmc" style="padding:2px 12px;font-size:12px;margin-top:2px">Cancelar</button>';
document.body.append(bar);
let mm=null;
const stopMM=()=>{if(mm){clearInterval(mm.h);mm=null}bar.classList.add('hide');$('go').disabled=false};
$('mmc').onclick=stopMM;
/* GANCHO MULTIPLAYER: quando houver servidor online, faça window.PF_realPlayers devolver os jogadores reais encontrados */
window.PF_realPlayers=window.PF_realPlayers||(()=>[]);
$('go').onclick=()=>{unlock();snd('start',1);if(mm)return;
 if(MODES[S.mode].dummy){_go();return}
 const wait=2+Math.random()*8,t0=performance.now();$('go').disabled=true;bar.classList.remove('hide');$('mmx').textContent='🔎 Buscando partida...';
 mm={h:setInterval(()=>{const e=(performance.now()-t0)/1000;$('mmn').textContent='0:'+String(Math.min(10,Math.floor(e))).padStart(2,'0');
  if(e>=wait){const real=window.PF_realPlayers();clearInterval(mm.h);$('mmx').textContent=real.length?'✅ Jogadores encontrados':'🤖 Sem jogadores reais · partida com bots';
   setTimeout(()=>{if(!mm)return;stopMM();_go()},700)}},100)}};

/* ---------- EMBLEMAS DE PATENTE ---------- */
const TIER={Bronze:['#e0954f','#6b3a12'],Prata:['#f1f5f9','#7d8794'],Ouro:['#ffe066','#b07a00'],Platina:['#8ff0f6','#1f7f8f'],Diamante:['#9cc0ff','#2b46c8'],Heroico:['#ff9a4a','#a01800'],Mestre:['#d98bff','#4a0f8a'],'Grão-Mestre':['#ff6b87','#6a0020']};
window.EMB=(n,s=32)=>{const[t,rn]=n.split(' '),v={I:1,II:2,III:3,IV:4}[rn]||1,[a,b]=TIER[t]||TIER.Bronze,id='e'+Math.random().toString(36).slice(2,8);let ic='';
 if(t=='Bronze'||t=='Prata'||t=='Ouro')for(let k=0;k<v;k++)ic+=`<path d="M19 ${24+k*8} L32 ${33+k*8} L45 ${24+k*8}" fill="none" stroke="#fff" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" opacity=".95"/>`;
 else if(t=='Platina')ic=`<path d="M32 15 L46 23 V39 L32 47 L18 39 V23 Z" fill="#fff" opacity=".9"/><text x="32" y="36" text-anchor="middle" font-size="14" font-weight="800" fill="${b}">${rn||''}</text>`;
 else if(t=='Diamante')ic=`<path d="M32 14 L47 28 L32 50 L17 28 Z" fill="#fff" opacity=".92"/><path d="M17 28 H47 M32 14 L26 28 L32 50 L38 28 Z" fill="none" stroke="${b}" stroke-width="1.5"/><text x="32" y="45" text-anchor="middle" font-size="9" font-weight="800" fill="${b}">${rn||''}</text>`;
 else if(t=='Heroico')ic=`<path d="M32 12 C35 23 45 26 45 37 C45 45 39 50 32 50 C25 50 19 45 19 37 C19 31 23 29 25 22 C28 26 30 26 32 12Z" fill="#fff" opacity=".93"/><path d="M32 30 C35 35 38 36 38 41 C38 45 35 47 32 47 C29 47 26 45 26 41 C26 37 30 35 32 30Z" fill="${a}"/>`;
 else ic=`<path d="M17 42 L15 22 L25 31 L32 15 L39 31 L49 22 L47 42 Z" fill="#fff" opacity=".95"/><rect x="17" y="42" width="30" height="5" rx="2" fill="#fff"/>`+(t=='Grão-Mestre'?`<path d="M32 4 l2.4 5 5.4.7-4 3.7 1 5.4-4.8-2.7-4.8 2.7 1-5.4-4-3.7 5.4-.7z" fill="#ffe066" stroke="${b}" stroke-width=".8"/>`:'');
 const wings=(t=='Mestre'||t=='Grão-Mestre')?`<path d="M12 20 Q-4 16 -8 36 Q2 30 12 38Z M52 20 Q68 16 72 36 Q62 30 52 38Z" fill="${a}" stroke="${b}" stroke-width="2"/>`:'';
 const vb=wings?'-10 0 84 64':'4 0 56 64',w_=wings?s*84/64:s*56/64;
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" width="${w_}" height="${s}" style="vertical-align:middle"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs>${wings}<path d="M32 3 L55 11 V32 C55 46 45 56 32 62 C19 56 9 46 9 32 V11 Z" fill="url(#${id})" stroke="${b}" stroke-width="3" stroke-linejoin="round"/><path d="M32 8 L50 14 V32 C50 43 42 51 32 56 C22 51 14 43 14 32 V14 Z" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.5"/>${ic}</svg>`};
/* emblema ao lado do nome no lobby */
const _hud=hud;hud=function(){_hud.apply(this,arguments);mestreCheck();const p=$('pn');if(!p)return;const t=p.textContent;p.textContent='';p.insertAdjacentHTML('beforeend',EMB(RTN(S.rp||0),24));p.append(' '+t)};

/* ---------- PASSES DE ELITE NO PERFIL: (1)(2)(3) · amarelo = comprado com diamantes · branco = só grátis ---------- */
window.PASSBAR=()=>{const d=document.createElement('div');d.style.cssText='margin:8px 0';d.innerHTML='<small>Passes de Elite:</small><br>';
 [[1,!!S.el],[2,!!S.el2],[3,!!S.el3]].forEach(([n,own])=>{const b=document.createElement('button');b.textContent=n;
  b.style.cssText=`width:38px;height:38px;border-radius:50%;margin:4px 6px 0 0;padding:0;font-size:17px;border:2px solid ${own?'#a37a00':'#bbb'};background:${own?'#ffc107':'#fff'};color:#111`;
  b.onclick=()=>n==1?passe():toast(own?'Passe '+n+': Elite ativo':'Passe '+n+' ainda não está disponível');d.append(b)});return d};
hud();
})();

<script>
/* dificuldade por patente + kill feed */
window.PFf=()=>{try{return Math.min(1,(window.RIX?RIX(S.rp|0):0)/20)}catch(e){return 0}};
window.bhp=()=>{const d=W&&W.M&&W.M.dummy;return d?150:Math.round(150*(1+1.2*PFf()))};
(()=>{
const kf=document.createElement('div');kf.id='kf';
kf.style.cssText='left:50%;top:56px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none!important;z-index:2';document.getElementById('hud').append(kf);
const sp=(t,c)=>{const e=document.createElement('b');e.textContent=t;e.style.color=c;return e};
window.feed=(a,b)=>{a=a||'Bot';b=b||'Bot';const me=S.name,d=document.createElement('div');
d.style.cssText='background:rgba(0,0,0,.62);border-left:3px solid '+(a==me?'#ffc107':b==me?'#ff4d4d':'#888')+';padding:2px 8px;font-size:12px;white-space:nowrap;transition:opacity .5s;text-shadow:1px 1px 0 #000';
d.append(sp(a,a==me?'#ffc107':'#fff'),document.createTextNode(' matou '),sp(b,b==me?'#ff6b6b':'#fff'));kf.append(d);
while(kf.children.length>4)kf.firstChild.remove();
setTimeout(()=>{d.style.opacity=0;setTimeout(()=>d.remove(),500)},4500)};
})();
</script>
<script>
/* tela deitada automática: tenta travar em paisagem ao abrir e, no primeiro toque, entra em tela cheia + trava */
(()=>{const lock=()=>{try{const o=screen.orientation;if(o&&o.lock)return o.lock('landscape').catch(()=>{})}catch(e){}};
lock();let done=0;
const go=()=>{if(done)return;done=1;try{const d=document.documentElement,p=d.requestFullscreen?d.requestFullscreen({navigationUI:'hide'}):d.webkitRequestFullscreen?d.webkitRequestFullscreen():null;Promise.resolve(p).catch(()=>{}).then(lock)}catch(e){lock()}};
['pointerdown','touchend','click'].forEach(t=>addEventListener(t,go,{passive:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)lock()});
})();
</script>

<script>

(g,b,t)=>{b.rotation.y=t*9;b.position.y=ab(sn(t*3))*.4;g.aL.rotation.set(0,0,-2.8);g.aR.rotation.set(0,0,2.8);g.lR.rotation.x=-.8},
